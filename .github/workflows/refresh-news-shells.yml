name: Refresh news pages

# Renders /news/ and /kk/news/ as static, indexable HTML from data/posts.json.
# Earlier this job copied the empty SPA shell (canonical → home) over the news
# pages, which kept them out of Google and invisible to AI crawlers.

on:
  push:
    paths:
      - data/posts.json
      - data/posts-admin.json
      - scripts/render-news-pages.py
      - scripts/site_nav.py

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render static news pages
        run: python3 scripts/render-news-pages.py
      - name: Commit news pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news kk/news
          git diff --staged --quiet || git commit -m "chore(news): render static news pages"
          git push
