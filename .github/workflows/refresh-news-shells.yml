name: Refresh news pages

# Re-renders the static site (news, sitemap, schema, link blocks) with the same
# pipeline used locally, so news edits from the admin never drop other
# generated blocks. Triggered only by news data changes.

on:
  push:
    paths:
      - data/posts.json
      - data/posts-admin.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild static pages
        run: python3 scripts/build-seo.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore(news): rebuild static pages"
          git push
