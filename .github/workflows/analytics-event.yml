name: Analytics event

on:
  repository_dispatch:
    types: [analytics_event]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Append analytics event
        run: node scripts/append-analytics-event.js '${{ toJson(github.event.client_payload) }}'
      - name: Commit events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git diff --staged --quiet || git commit -m "chore(analytics): append site event"
          git push
